<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Résumé — Somnath Mahata</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: 'Baloo 2', 'Quicksand', system-ui, sans-serif;
        background: linear-gradient(180deg, #8ecfe6 0%, #bfe6ea 45%, #f4e9c8 80%, #fbf3df 100%);
        color: #2c2618;
        padding: 24px;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(180deg, #101838 0%, #1c2650 45%, #33284f 80%, #171e33 100%);
          color: #f3f1ff;
        }
      }
      main { max-width: 380px; }
      .leaf { font-size: 44px; display: block; margin-bottom: 14px; animation: sway 4s ease-in-out infinite; }
      h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
      p { font-size: 15px; opacity: 0.75; line-height: 1.6; font-family: 'Nunito', system-ui, sans-serif; }
      a { color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
      @keyframes sway { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    </style>
  </head>
  <body>
    <main>
      <span class="leaf">🌱</span>
      <h1>Résumé coming soon</h1>
      <p>This page is being replanted. In the meantime, wander <a href="/">back to the meadow</a>.</p>
    </main>
  </body>
</html>
